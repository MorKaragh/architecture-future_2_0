name: Task2Advanced Terraform

on:
  pull_request:
    paths:
      - "Task2Advanced/terraform/**"
      - "Task2Advanced/modules/**"
      - "Task2Advanced/bootstrap/**"
      - "Task2Advanced/scripts/**"
      - ".github/workflows/terraform-task2-advanced.yml"
  push:
    branches:
      - main
    paths:
      - "Task2Advanced/terraform/**"
      - "Task2Advanced/modules/**"
      - "Task2Advanced/bootstrap/**"
      - "Task2Advanced/scripts/**"
      - ".github/workflows/terraform-task2-advanced.yml"
  workflow_dispatch:

concurrency:
  group: task2-tf-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task2Advanced/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: terraform fmt
        run: terraform fmt -check -recursive ..

      - name: terraform init (без backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  plan:
    name: plan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - lint
    defaults:
      run:
        working-directory: Task2Advanced/terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
      YC_TOKEN: ${{ secrets.YC_TOKEN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VAR_cloud_id: ${{ vars.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
      TF_VAR_zone: ${{ vars.YC_ZONE }}
      TF_VAR_subnet_id: ${{ vars.YC_SUBNET_ID }}
      TF_VAR_vm_name: ${{ vars.TF_VAR_VM_NAME }}
      TF_VAR_cores: ${{ vars.TF_VAR_CORES }}
      TF_VAR_memory: ${{ vars.TF_VAR_MEMORY }}
      TF_VAR_attach_disk_size: ${{ vars.TF_VAR_ATTACH_DISK_SIZE }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_SSH_PUBLIC_KEY }}
      TF_VAR_labels: '{"environment":"ci","project":"future20"}'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Сборка backend.generated.hcl
        run: bash scripts/render-backend-ci.sh
        working-directory: Task2Advanced

      - name: terraform init
        run: terraform init -input=false -backend-config=backend.generated.hcl

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: Task2Advanced/terraform/tfplan
          if-no-files-found: error

  apply:
    name: apply
    runs-on: ubuntu-latest
    needs:
      - plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: task2-terraform-apply
    defaults:
      run:
        working-directory: Task2Advanced/terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
      YC_TOKEN: ${{ secrets.YC_TOKEN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VAR_cloud_id: ${{ vars.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
      TF_VAR_zone: ${{ vars.YC_ZONE }}
      TF_VAR_subnet_id: ${{ vars.YC_SUBNET_ID }}
      TF_VAR_vm_name: ${{ vars.TF_VAR_VM_NAME }}
      TF_VAR_cores: ${{ vars.TF_VAR_CORES }}
      TF_VAR_memory: ${{ vars.TF_VAR_MEMORY }}
      TF_VAR_attach_disk_size: ${{ vars.TF_VAR_ATTACH_DISK_SIZE }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_SSH_PUBLIC_KEY }}
      TF_VAR_labels: '{"environment":"ci","project":"future20"}'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: Task2Advanced/terraform

      - name: Сборка backend.generated.hcl
        run: bash scripts/render-backend-ci.sh
        working-directory: Task2Advanced

      - name: terraform init
        run: terraform init -input=false -backend-config=backend.generated.hcl

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan
